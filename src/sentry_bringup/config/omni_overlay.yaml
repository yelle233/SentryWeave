# Optional Jazzy native holonomic controller. Calibrate all limits for the actual chassis.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      time_steps: 40
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_max: 1.5
      vx_min: -1.0
      vy_max: 1.5
      wz_max: 2.0
      vx_std: 0.3
      vy_std: 0.3
      wz_std: 0.4
      ax_max: 1.8
      ax_min: -2.0
      ay_max: 1.8
      az_max: 3.0
      prune_distance: 2.0
      temperature: 0.3
      gamma: 0.015
      visualize: false
      transform_tolerance: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathFollowCritic", "PathAlignCritic"]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      CostCritic: {enabled: true, cost_power: 1, cost_weight: 3.8, critical_cost: 300.0, collision_cost: 1000000.0, near_collision_cost: 253}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.4}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
      PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, offset_from_furthest: 6, threshold_to_consider: 1.4}
      PathAlignCritic: {enabled: true, cost_power: 1, cost_weight: 10.0, offset_from_furthest: 10, threshold_to_consider: 0.5}
velocity_smoother:
  ros__parameters:
    max_velocity: [1.5, 1.5, 2.0]
    min_velocity: [-1.0, -1.5, -2.0]
    max_accel: [1.8, 1.8, 3.0]
    max_decel: [-2.0, -2.0, -3.0]
