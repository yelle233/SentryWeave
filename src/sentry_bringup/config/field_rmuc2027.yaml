# RMUC 2027 field semantics (red perspective; mirror: auto reflects through (14, 7.5) for BLUE).
# Numbers derived from Arena-1 (github.com/RM-Arena/Arena-1) e70c1f010edf, config/rules.json maps.rmuc2027 (layout chapter4-2027-v2).
# Arena-1 measured them from the 2027 rules manual drawings (2-4 cm reported deviation);
# values are rounded to 1 mm. Frame: x along the 28 m side from the red end, y along the 15 m
# side, z up, yaw counter-clockwise from +x: identical to Arena-1, so no conversion is applied.
# Obstacles: Arena-1 barriers with an underside below 1.0 m (rotated boxes -> 4 corners), terrain
# a wheeled sentry cannot climb (high points as convex hulls, steps, ledges, bands, rims,
# pedestals) and both base bodies/dart stations. Keep-outs: the enemy supply and assembly areas.
# Assumptions (owner-approved; check them on your own robot and field):
# - sentry radius 0.35 m (robot_radius in tactics_rmuc2027.yaml);
# - tunnels, high points and steps are obstacles: the sentry is taken to be too tall for the
#   tunnel roofs and unable to climb the high points, steps, ledges and rims;
# - the 23° trapezoid ramps are drivable, like the gentler slopes and the bump strips, so none
#   of them is listed.
# Source note only: numbers were read from Arena-1 (non-commercial licence); no Arena-1 code is
# included in this repository.
# Survey your own field before matches; tactics only approximate it, Nav2 has the final say.
