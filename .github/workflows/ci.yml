name: SentryWeave CI
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests tools
      - run: pytest tests -q
  jazzy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentryweave:ci -f docker/Dockerfile .
      - run: docker run --rm sentryweave:ci bash tools/ros_exec.bash python3 -m pytest tests -q
  offline-learning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,rl]'
      - run: pytest tests/test_offline_data.py tests/test_offline_learning.py tests/test_rl_policy.py -q
