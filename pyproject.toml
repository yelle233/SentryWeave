[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentryweave"
version = "0.1.0"
description = "SentryWeave: cooperative RoboMaster sentry decisions and offline learning for ROS 2 Jazzy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "integrations/rmuc_offlinerl/LICENSE.reference"]
authors = [{name = "yelle233", email = "1376982098@qq.com"}]
maintainers = [{name = "未来战队", email = "1376982098@qq.com"}]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.urls]
Homepage = "https://github.com/yelle233/SentryWeave"
Repository = "https://github.com/yelle233/SentryWeave"
Documentation = "https://github.com/yelle233/SentryWeave/tree/main/docs"
Issues = "https://github.com/yelle233/SentryWeave/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9"]
rl = ["torch>=2.7,<3", "safetensors>=0.5,<1", "py7zr>=1,<2"]

[project.scripts]
sentry-train = "sentry_training.cli:main"
sentry-rl = "sentry_training.offline.cli:main"

[tool.setuptools.packages.find]
where = ["src/sentry_core", "src/sentry_training", "src/sentry_ros"]
include = ["sentry_core*", "sentry_training*", "sentry_ros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/sentry_core", "src/sentry_training", "src/sentry_ros", "tools"]
markers = ["ros: requires a built ROS 2 Jazzy workspace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
